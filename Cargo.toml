[package]
name = "boardc"
version = "0.1.0"
edition = "2024"
description = "Headless native Rust PCB compiler: IR, placement legalizer, zone filler, viahop router, DRC clusterer, and Gerber/Excellon/BOM/CPL emitter"
license = "MIT"
readme = "README.md"
repository = "https://github.com/owahltinez/boardc"
keywords = ["pcb", "eda", "gerber", "drc", "autorouter"]
categories = ["command-line-utilities", "science", "hardware-support"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clipper2-rust = "1.3"
gerber-types = "0.7"
gerber_parser = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
viahop = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
